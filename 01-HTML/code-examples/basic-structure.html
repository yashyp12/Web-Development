<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Example</title>
</head>
<body>
    <header>
        <h1>Welcome to Web Development</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About This Repository</h2>
            <p>This is a comprehensive web development learning repository.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Feel free to reach out for questions and collaboration!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Web Development Learning Journey</p>
    </footer>
</body>
</html>
